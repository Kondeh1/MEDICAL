<!DOCTYPE html>
<html>
<head>
    <title>WebRTC Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .video-container { display: flex; gap: 20px; margin: 20px 0; }
        video { width: 300px; height: 200px; background: #333; border: 1px solid #ccc; }
        .controls { margin: 20px 0; }
        button { padding: 10px 15px; margin: 5px; }
        .log { background: #f5f5f5; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .status { padding: 10px; border-radius: 5px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>WebRTC Connection Test</h1>
    
    <div class="status warning" id="status">
        Ready to test WebRTC functionality
    </div>
    
    <div class="video-container">
        <div>
            <h3>Local Stream</h3>
            <video id="localVideo" autoplay muted></video>
        </div>
        <div>
            <h3>Remote Stream</h3>
            <video id="remoteVideo" autoplay></video>
        </div>
    </div>
    
    <div class="controls">
        <button onclick="startLocalStream()">Start Local Stream</button>
        <button onclick="testWebRTC()">Test WebRTC Connection</button>
        <button onclick="checkBrowserSupport()">Check Browser Support</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="log" id="log">
        <h3>Test Log:</h3>
        <pre id="logContent">Click buttons above to run tests...</pre>
    </div>

    <script>
        let localStream = null;
        let peerConnection = null;
        let websocket = null;
        
        // STUN servers configuration
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };
        
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const logContent = document.getElementById('logContent');
        const statusDiv = document.getElementById('status');
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logContent.textContent += `[${timestamp}] ${message}\n`;
            logContent.scrollTop = logContent.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(message, type = 'warning') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function clearLog() {
            logContent.textContent = 'Log cleared...\n';
        }
        
        async function startLocalStream() {
            try {
                updateStatus('Requesting camera/microphone access...', 'warning');
                log('Requesting user media...');
                
                const constraints = {
                    video: true,
                    audio: true
                };
                
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                
                log('Local stream obtained successfully');
                log(`Stream tracks: ${localStream.getTracks().map(t => t.kind).join(', ')}`);
                updateStatus('Local stream active', 'success');
                
            } catch (error) {
                log(`Error accessing media: ${error.message}`);
                updateStatus('Failed to access camera/microphone', 'error');
                alert('Could not access camera/microphone. Please check permissions.');
            }
        }
        
        function checkBrowserSupport() {
            log('Checking browser WebRTC support...');
            
            const features = [
                'RTCPeerConnection',
                'RTCSessionDescription',
                'RTCIceCandidate',
                'navigator.mediaDevices',
                'navigator.mediaDevices.getUserMedia'
            ];
            
            let allSupported = true;
            
            features.forEach(feature => {
                const supported = typeof window[feature] !== 'undefined';
                log(`${feature}: ${supported ? '✓ Supported' : '✗ Not supported'}`);
                if (!supported) allSupported = false;
            });
            
            if (allSupported) {
                log('✓ All required WebRTC features are supported!');
                updateStatus('Browser supports WebRTC', 'success');
            } else {
                log('✗ Some WebRTC features are missing');
                updateStatus('Browser missing WebRTC features', 'error');
            }
            
            // Check HTTPS/localhost requirement
            if (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                log('✓ Secure context available (HTTPS or localhost)');
            } else {
                log('✗ WebRTC requires HTTPS or localhost');
                updateStatus('WebRTC requires secure context', 'error');
            }
        }
        
        async function testWebRTC() {
            if (!localStream) {
                log('Please start local stream first');
                updateStatus('Start local stream first', 'warning');
                return;
            }
            
            try {
                log('Testing WebRTC peer connection...');
                updateStatus('Testing WebRTC connection...', 'warning');
                
                // Create peer connection
                peerConnection = new RTCPeerConnection(configuration);
                log('PeerConnection created with configuration:');
                log(JSON.stringify(configuration, null, 2));
                
                // Add local tracks
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                    log(`Added track: ${track.kind}`);
                });
                
                // Set up event handlers
                peerConnection.onicecandidate = function(event) {
                    if (event.candidate) {
                        log(`ICE candidate generated: ${event.candidate.type}`);
                    }
                };
                
                peerConnection.onconnectionstatechange = function() {
                    log(`Connection state: ${peerConnection.connectionState}`);
                    log(`ICE connection state: ${peerConnection.iceConnectionState}`);
                };
                
                peerConnection.onsignalingstatechange = function() {
                    log(`Signaling state: ${peerConnection.signalingState}`);
                };
                
                // Test connection by creating offer to ourselves
                log('Creating test offer...');
                const offer = await peerConnection.createOffer();
                log('Offer created successfully');
                
                await peerConnection.setLocalDescription(offer);
                log('Local description set');
                
                // Simulate receiving the offer (loopback test)
                log('Setting remote description (loopback test)...');
                await peerConnection.setRemoteDescription(offer);
                
                log('Creating answer...');
                const answer = await peerConnection.createAnswer();
                log('Answer created');
                
                await peerConnection.setLocalDescription(answer);
                log('Answer set as local description');
                
                log('✓ WebRTC connection test completed successfully!');
                updateStatus('WebRTC connection working', 'success');
                
            } catch (error) {
                log(`WebRTC test failed: ${error.message}`);
                log(`Error stack: ${error.stack}`);
                updateStatus('WebRTC connection failed', 'error');
            }
        }
        
        // Run initial checks
        window.addEventListener('load', function() {
            log('WebRTC Test Page loaded');
            checkBrowserSupport();
        });
    </script>
</body>
</html>
