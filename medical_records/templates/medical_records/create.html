{% extends "base.html" %}
{% load form_utils %}

{% block title %}Add medical record — Telemedicine{% endblock %}

{% block content %}
<h2 class="mb-4">Add medical record</h2>
<form method="post" action="">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{% url 'medical_records:list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
