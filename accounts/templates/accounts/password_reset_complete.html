{% extends "base.html" %}

{% block title %}Password Reset Complete — Telemedicine{% endblock %}

{% block extra_css %}
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    position: relative;
    overflow: hidden;
  }

  .login-page::before {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    background: 
      radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
      radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 40%);
    animation: moveBackground 15s ease-in-out infinite;
  }

  @keyframes moveBackground {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    33% { transform: translate(-2%, 2%) rotate(1deg); }
    66% { transform: translate(2%, -2%) rotate(-1deg); }
  }

  .login-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }

  .login-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 50px 40px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    animation: fadeInUp 0.8s ease-out;
    text-align: center;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .success-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 30px;
    font-size: 2.5rem;
    color: white;
  }

  .login-title {
    color: white;
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 15px;
  }

  .login-subtitle {
    color: rgba(255, 255, 255, 0.7);
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .login-btn {
    display: inline-block;
    padding: 15px 40px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
    color: white;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .login-card {
    animation: fadeInUp 0.8s ease-out, float 6s ease-in-out infinite;
  }
</style>
{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="success-icon">
        <i class="bi bi-check-lg"></i>
      </div>
      <h1 class="login-title">Success!</h1>
      <p class="login-subtitle">
        Your password has been set successfully. 
        You can now log in with your new password.
      </p>
      <a href="{% url 'accounts:login' %}" class="login-btn">Log In Now</a>
    </div>
  </div>
</div>
{% endblock %}
